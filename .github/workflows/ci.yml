name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt

      # No secrets in CI: the fixture ships plain-text fixture secrets, and
      # --stub replaces whatever the state has.
      - name: state is valid
        run: go run ./cmd/vpnctl check -dir testdata/basic --stub

      - name: render is reproducible
        run: |
          go run ./cmd/vpnctl render -dir testdata/basic --stub --out /tmp/r1
          go run ./cmd/vpnctl render -dir testdata/basic --stub --out /tmp/r2
          diff -r /tmp/r1 /tmp/r2
