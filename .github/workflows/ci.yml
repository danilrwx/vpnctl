name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # То же задание для репозитория состояния без ключа age:
      # vpnctl -C <состояние> --stub-secrets validate && vpnctl -C <состояние> --stub-secrets render --check
      - run: cargo run -q -- -C tests/fixtures/basic --stub-secrets render --check
