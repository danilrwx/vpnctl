name: release

# A signed APK, the CLI and the agent. The keystore lives in secrets, and a tag
# does not have one: dispatch it with the two numbers the app ships with.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: versionName, e.g. 0.2.0
        required: true
      version_code:
        description: versionCode, a positive integer
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # v3 installs "tools" by default, and that package no longer exists in
      # the SDK repository; platform-tools is all this build needs from it
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: SDK pieces the build needs
        run: sdkmanager --install "platforms;android-35" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: gomobile init

      - name: keystore
        env:
          KEYSTORE: ${{ secrets.VPNCTL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "VPNCTL_KEYSTORE_BASE64 is not set" >&2; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: assemble the signed APK
        working-directory: app
        env:
          VPNCTL_KEYSTORE: ${{ runner.temp }}/release.jks
          VPNCTL_KEYSTORE_PASSWORD: ${{ secrets.VPNCTL_KEYSTORE_PASSWORD }}
          VPNCTL_KEY_ALIAS: ${{ secrets.VPNCTL_KEY_ALIAS }}
          VPNCTL_KEY_PASSWORD: ${{ secrets.VPNCTL_KEY_PASSWORD }}
          VPNCTL_VERSION_NAME: ${{ inputs.version_name }}
          VPNCTL_VERSION_CODE: ${{ inputs.version_code }}
        run: gradle assembleRelease

      - name: the APK is signed with the release key
        run: |
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" verify --print-certs app/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs app/app/build/outputs/apk/release/app-release.apk \
            | grep -F "CN=vpnctl"

      - name: the binaries and the tarballs
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
                -o dist/vpnctl ./cmd/vpnctl
              tar -czf "dist/vpnctl_${os}_${arch}.tar.gz" -C dist vpnctl
            done
          done
          rm -f dist/vpnctl
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist/vpnctl-agent ./cmd/vpnctl-agent
            tar -czf "dist/vpnctl-agent_linux_${arch}.tar.gz" -C dist vpnctl-agent
          done
          rm -f dist/vpnctl-agent
          cp app/app/build/outputs/apk/release/app-release.apk dist/vpnctl.apk
          (cd dist && sha256sum vpnctl* > sha256sums.txt)
          ls -lh dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version_name }}
          TAG: v${{ inputs.version_name }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          The signed Android APK, the CLI for Linux and macOS, and the agent for Linux.
          Download an asset, verify it against `sha256sums.txt`, then install it.

          ## Install

          ```sh
          # the CLI, on a laptop
          curl -LO https://github.com/danilrwx/vpnctl/releases/latest/download/vpnctl_linux_amd64.tar.gz
          tar xzf vpnctl_linux_amd64.tar.gz
          install -m0755 vpnctl ~/.local/bin/

          # the agent, on a host
          curl -LO https://github.com/danilrwx/vpnctl/releases/latest/download/vpnctl-agent_linux_amd64.tar.gz
          tar xzf vpnctl-agent_linux_amd64.tar.gz
          install -m0755 vpnctl-agent /usr/local/bin/
          ```

          | asset | what it is |
          |---|---|
          | `vpnctl.apk` | the Android app, signed with the release key |
          | `vpnctl_linux_amd64.tar.gz` | the CLI, Linux amd64 |
          | `vpnctl_linux_arm64.tar.gz` | the CLI, Linux arm64 |
          | `vpnctl_darwin_amd64.tar.gz` | the CLI, macOS Intel |
          | `vpnctl_darwin_arm64.tar.gz` | the CLI, macOS Apple silicon |
          | `vpnctl-agent_linux_amd64.tar.gz` | the agent, Linux amd64 |
          | `vpnctl-agent_linux_arm64.tar.gz` | the agent, Linux arm64 |
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "vpnctl $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
