exit:
  policy: fixed
  prefer: fi-hel-1
  urltest:
    interval_s: 60
    tolerance_ms: 300
    failures: 2
groups:
  all:
    - match:
        inbound:
          - probe
      action:
        link: auto
      note: проба цепочки и upstream mtg
    - match:
        sets:
          - ads
      action: block
      note: реклама
  split:
    - match:
        sets:
          - ru-direct
      action: direct
      note: российские сервисы напрямую
    - match:
        geoip:
          - ru
          - private
      action: direct
      note: российские адреса напрямую
    - match:
        geosite:
          - youtube
      action:
        link: fi-hel-1
      note: youtube через fi
    - action:
        link: auto
      note: всё остальное через выход
  full:
    - action:
        link: auto
      note: всё через выход
dns:
  direct:
    - 77.88.8.8
    - 1.1.1.1
  remote: https://1.1.1.1/dns-query
