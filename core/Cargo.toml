[package]
name = "vpnctl-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ipnet = { version = "2.12.2", features = ["serde"] }
minijinja = "3.0.5"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
sha2 = "0.11.1"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
