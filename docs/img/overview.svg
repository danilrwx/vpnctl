<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="14" fill="#0e1116"/>

  <!-- laptop -->
  <rect x="40" y="90" width="230" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="155" y="118" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="1">OPERATOR'S LAPTOP</text>
  <text x="155" y="148" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="16">vpnctl</text>
  <text x="155" y="172" text-anchor="middle" fill="#c9d1d9">state in git</text>
  <text x="155" y="192" text-anchor="middle" fill="#c9d1d9">metrics.sqlite</text>
  <text x="155" y="218" text-anchor="middle" fill="#8b949e" font-size="12">age key on YubiKey</text>

  <!-- entry -->
  <rect x="370" y="60" width="250" height="210" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="495" y="88" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="1">ENTRY · RUSSIA · gw.example.ru</text>
  <text x="495" y="118" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="16">sing-box</text>
  <text x="495" y="142" text-anchor="middle" fill="#c9d1d9">reality · ws · hysteria2 · awg · mtg</text>
  <line x1="390" y1="158" x2="600" y2="158" stroke="#30363d"/>
  <text x="495" y="180" text-anchor="middle" fill="#3fb950">geosite ru · geoip ru → direct</text>
  <text x="495" y="200" text-anchor="middle" fill="#58a6ff">everything else → link</text>
  <text x="495" y="232" text-anchor="middle" fill="#8b949e" font-size="12">caddy · nftables tproxy · probe socks</text>
  <text x="495" y="252" text-anchor="middle" fill="#8b949e" font-size="12">jump host for exits</text>

  <!-- exits -->
  <rect x="720" y="60" width="200" height="80" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="820" y="88" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="1">EXIT · FINLAND</text>
  <text x="820" y="112" text-anchor="middle" fill="#e6edf3" font-weight="700">fi-hel-1 · active</text>
  <text x="820" y="130" text-anchor="middle" fill="#c9d1d9" font-size="12">awg peer + NAT · reality inbound</text>

  <rect x="720" y="190" width="200" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="820" y="218" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="1">EXIT · NETHERLANDS</text>
  <text x="820" y="242" text-anchor="middle" fill="#8b949e" font-weight="700">nl-ams-1 · standby</text>
  <text x="820" y="260" text-anchor="middle" fill="#8b949e" font-size="12">urltest switches on its own</text>

  <!-- arrows laptop -> entry -->
  <line x1="270" y1="150" x2="368" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="319" y="142" text-anchor="middle" fill="#58a6ff" font-size="12">ssh · apply</text>
  <line x1="368" y1="186" x2="272" y2="186" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="319" y="204" text-anchor="middle" fill="#8b949e" font-size="12">metrics · probes</text>

  <!-- entry -> exits -->
  <line x1="620" y1="110" x2="718" y2="100" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <text x="668" y="92" text-anchor="middle" fill="#3fb950" font-size="12">awg · reality</text>
  <line x1="620" y1="210" x2="718" y2="230" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="668" y="246" text-anchor="middle" fill="#8b949e" font-size="12">standby link</text>

  <!-- users -->
  <rect x="370" y="296" width="250" height="40" rx="8" fill="#0e1116" stroke="#30363d" stroke-dasharray="4 3"/>
  <text x="495" y="320" text-anchor="middle" fill="#c9d1d9" font-size="12">users: Karing · Happ · AWG routers · Telegram</text>
  <line x1="495" y1="296" x2="495" y2="272" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="286" fill="#8b949e" font-size="11">domain, TTL 120</text>

  <text x="40" y="330" fill="#8b949e" font-size="12">Every change is a commit. No web panel, no agents on hosts.</text>
</svg>
