<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <rect width="960" height="420" rx="14" fill="#0e1116"/>

  <!-- клиенты -->
  <rect x="40" y="40" width="230" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="155" y="64" text-anchor="middle" fill="#e6edf3" font-weight="700">клиенты</text>
  <text x="155" y="84" text-anchor="middle" fill="#8b949e" font-size="12">Karing · Happ · роутер AWG · Telegram</text>
  <line x1="155" y1="104" x2="155" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#g)"/>
  <text x="166" y="132" fill="#8b949e" font-size="11">gw.example.ru · TTL 120</text>

  <!-- вход -->
  <rect x="40" y="152" width="560" height="228" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="176" fill="#8b949e" font-size="12" letter-spacing="1">ВХОД В РФ · ДЖАМП-ХОСТ</text>

  <text x="60" y="206" fill="#e6edf3">443 tcp</text><text x="128" y="206" fill="#c9d1d9">Reality</text>
  <text x="60" y="226" fill="#e6edf3">443 tcp</text><text x="128" y="226" fill="#c9d1d9">→ caddy 8443: сайт, ws, подписки</text>
  <text x="60" y="246" fill="#e6edf3">443 udp</text><text x="128" y="246" fill="#c9d1d9">Hysteria2</text>
  <text x="60" y="266" fill="#e6edf3">51820</text><text x="128" y="266" fill="#c9d1d9">AWG → tproxy</text>
  <text x="60" y="286" fill="#e6edf3">2053</text><text x="128" y="286" fill="#c9d1d9">mtg → probe socks</text>

  <rect x="370" y="190" width="210" height="110" rx="8" fill="#0e1116" stroke="#30363d"/>
  <text x="475" y="212" text-anchor="middle" fill="#e6edf3" font-weight="700">движок маршрутизации</text>
  <text x="475" y="230" text-anchor="middle" fill="#8b949e" font-size="12">sing-box (или xray)</text>
  <text x="475" y="256" text-anchor="middle" fill="#3fb950">geosite ru · geoip ru → direct</text>
  <text x="475" y="276" text-anchor="middle" fill="#58a6ff">остальное → линк</text>
  <line x1="300" y1="246" x2="368" y2="246" stroke="#8b949e" stroke-width="2" marker-end="url(#g)"/>

  <text x="60" y="322" fill="#8b949e" font-size="12">режимы: split — российское напрямую · full — всё через выход</text>
  <text x="60" y="340" fill="#8b949e" font-size="12">учётки движка: имя-режим-протокол · L3-пиры: подсеть 10.8.1/24 split, 10.8.2/24 full</text>
  <text x="60" y="362" fill="#8b949e" font-size="12">sniffing tls/http/quic · DNS клиентам — адрес входа</text>

  <!-- напрямую -->
  <line x1="440" y1="300" x2="440" y2="398" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
  <text x="452" y="402" fill="#3fb950" font-size="12">напрямую из РФ: Госуслуги, банки, Яндекс</text>

  <!-- выходы -->
  <line x1="600" y1="230" x2="698" y2="200" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
  <text x="640" y="150" text-anchor="middle" fill="#3fb950" font-size="11">AWG в ядре</text>
  <text x="640" y="164" text-anchor="middle" fill="#3fb950" font-size="11">Reality запасной</text>
  <line x1="600" y1="270" x2="698" y2="318" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="648" y="304" text-anchor="middle" fill="#8b949e" font-size="11">urltest</text>

  <rect x="700" y="160" width="220" height="78" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="810" y="184" text-anchor="middle" fill="#e6edf3" font-weight="700">выход FI · активный</text>
  <text x="810" y="204" text-anchor="middle" fill="#c9d1d9" font-size="12">AWG-пир + NAT</text>
  <text x="810" y="222" text-anchor="middle" fill="#c9d1d9" font-size="12">sing-box: один Reality-inbound</text>

  <rect x="700" y="290" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="810" y="314" text-anchor="middle" fill="#8b949e" font-weight="700">выход NL · резерв</text>
  <text x="810" y="334" text-anchor="middle" fill="#8b949e" font-size="12">переключение без участия оператора</text>

  <text x="810" y="372" text-anchor="middle" fill="#8b949e" font-size="12">выходы применяются раньше джампа</text>
</svg>
